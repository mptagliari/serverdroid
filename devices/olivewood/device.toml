[research.bootloader]
outcome = "unknown"
summary = "The LineageOS install method for this device is fastboot-based, which suggests an unlockable bootloader. The vendor unlock policy (account, waiting time, data wipe) was not read from the vendor page, and search summaries disagree on the waiting time. Not assessed."
sources = ["lineage-wiki-device", "xiaomi-unlock-faq"]

[research.kernel]
outcome = "feasible"
summary = "A maintained downstream Linux 4.19 tree exists for the SDM439 family and its board list names olivewood, so a vendor-kernel starting point is available. No upstream device tree for SDM439 was found; mainline use would rely on a downstream-of-mainline fork, whose olivewood coverage was not checked."
sources = ["lineage-kernel", "lineage-device-tree"]

[research.hardware_minimum]
outcome = "unknown"
summary = "Storage is reported as eMMC 5.1 and Wi-Fi as 802.11 b/g/n. Charging and battery behaviour, which a headless server needs, was not sourced for olivewood; secondhand reports for the sibling olive were not verified. Not assessed."
sources = ["lineage-wiki-device", "wikipedia-redmi-8", "pmos-olive-deviceinfo"]

